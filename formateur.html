{const N0=Date.now(),A=(i,k,v,h)=>P[i].nm.push({k,s:N0-h*36e5,v,ev:[{t:N0-h*36e5,v:{...v}}]});
A(0,'ent',{deb:30},10);A(1,'dv',{dur:16},6);A(1,'ecmo',{qs:4,bal:4,fi:80},20);A(1,'ent',{deb:40},14);A(2,'tc',{tc:36.5},5);A(3,'kine',{n:2,h:10,e:6},12);A(4,'kine',{n:3,h:9,e:4},8);A(4,'ent',{deb:40},9);A(5,'kine',{n:3,h:9,e:4},7);A(6,'tc',{tc:36},18);A(6,'ent',{deb:50},16);A(7,'ent',{deb:40},11);A(7,'kine',{n:2,h:10,e:6},6);A(8,'ent',{deb:20},12);A(9,'kine',{n:3,h:9,e:4},6);A(10,'ent',{deb:40},9);A(10,'kine',{n:2,h:10,e:6},5);A(11,'kine',{n:2,h:10,e:6},4)}

{const t0=Date.now();P[1].hx.push({d:2,x:.15,c:1,fl:flow(2,.15,1,95),s:t0-20*36e5,e:t0-6*36e5,ev:[{t:t0-20*36e5,x:.1},{t:t0-13*36e5,x:.15}]})}
/* ====== Simulation en santé : patients fictifs, scénarios, médicaments personnalisés ====== */
let FM=true,W=null;
const VR={hr:{l:'Fréquence cardiaque',u:'bpm',min:25,max:220,dd:0},pa:{l:'Pression artérielle',u:'mmHg'},spo2:{l:'SpO₂',u:'%',min:50,max:100,dd:0},rr:{l:'Fréquence respiratoire',u:'/min',min:4,max:60,dd:0},t:{l:'Température',u:'°C',min:30,max:43,dd:1},di:{l:'Diurèse',u:'mL/kg/h',min:0,max:10,dd:1},evn:{l:'EVN (douleur)',u:'/10',min:0,max:10,dd:0}};
const VK={hr:'hr',pa:'map',spo2:'spo2',rr:'rr',t:'t',di:'di',evn:'evn'},DV={hr:140,spo2:85,rr:32,t:39.5,di:.2,evn:8};
const RS={none:'Aucune (persiste)',fill:'Après remplissage vasculaire',drug:'Après administration d’un médicament',auto:'Spontanée après un délai',man:'Manuelle (formateur)'};
const SY=(m,pp)=>R(m+2*(pp??45)/3),DY=(m,pp)=>R(m-(pp??45)/3);
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.round(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const clean=t=>String(t??'').replace(/[<>&"]/g,'').trim();
let HS=Date.now();

/* ---- moteur ---- */
function evTo(p,e){if(e.k=='pa')return{map:(+e.ps+2*e.pd)/3,pp:e.ps-e.pd};if(e.k=='di')return{di:e.v*p.kg};return{[e.k]:+e.v}}
const LG=e=>e.lg===''||e.lg==null?2:+e.lg,H50=e=>e.h50===''||e.h50==null?3:+e.h50;
function evW(e,el){if(e.st=='on')return (+e.z>0?Math.min(1,(el-e.ts)/(e.z*6e4)):1)*(1-(e.cr||0));if(e.st=='res')return e.res=='fill'?0:+e.r>0?Math.max(0,1-(el-e.tr)/(e.r*6e4)):0;return 0}
const isFill=d=>d.it&&d.nd&&!d.blood;
function fillVol(p,t0,t1){const N=t1??Date.now();if(!(N>t0))return 0;return [...p.rx,...p.hx].filter(r=>isFill(DR[r.d])).reduce((s,r)=>s+vol(p,r,t0,N),0)}
function gotDrug(p,n,t0,lg){const N=Date.now()-(lg||0);return [...p.rx,...p.hx].some(r=>DR[r.d].n==n&&(r.it?adm(r,t0-6e4,N).some(a=>a.s>=t0-6e4&&a.s<=N):r.ev.some(v=>v.t>=t0&&v.t<=N)))}
function trig(p,e,el){e.st='on';e.cr=0;e.ts=el;e.tR=Date.now();log(`Simulation : déclenchement, ${evLab(e)}`,p.b)}
function reso(p,e,el,how){e.st='res';e.tr=el;log(`Simulation : résolution${how=='man'?' par le formateur':''}, ${evLab(e)}`,p.b)}
function scStep(p){const s=p.sc;if(!s||!s.run)return;s.el+=1000;const el=s.el;s.ev.forEach(e=>{
if(e.st=='wait'&&el>=e.nx)trig(p,e,el);
if(e.st=='on'&&e.res=='fill'){const N=Date.now()-LG(e)*6e4,T=Math.max(6,(H50(e)-LG(e))*60);if(fillVol(p,Math.max(e.tR-6e4,N-1500),N)>0)e.cr=(e.cr||0)+(1-(e.cr||0))*(1-Math.pow(2,-1/T))}
if(e.st=='on'&&(e.res=='fill'&&e.cr>=.98||e.res=='drug'&&gotDrug(p,e.rd,e.tR,LG(e)*6e4)||e.res=='auto'&&el-e.ts>=e.rv*6e4))reso(p,e,el);
if(e.st=='res'&&evW(e,el)<=0){if(e.left>0){e.left--;e.st='wait';e.nx=el+(+e.rt||0)*6e4}else e.st='done'}})}
function fxD(p,k){if(!p.fx||!p.fx.length)return 0;const N=Date.now();let s=0;
p.fx.forEach(x=>{if(VK[x.k]!=k)return;const lag=Math.max(.05,+x.lag||0)*6e4,dv=x.k=='di'?x.dv*p.kg:+x.dv,
one=(s0,E,sc)=>{if(N<s0)return 0;const a=Math.min(1,(N-s0)/lag),b=N<=E?1:Math.max(0,1-(N-E)/lag);return a*b*sc};
[...p.rx,...p.hx].forEach(r=>{const D=DR[r.d];if(D.n!=x.dn)return;
if(r.it)adm(r,N-2*DAY,N).forEach(a=>{const E=a.s+(+x.dur>0?x.dur*6e4:a.du);s+=dv*one(a.s,E,x.pr?a.x/(D.d||1):1)});
else{const e0=r.e??Infinity,E=+x.dur>0?Math.min(e0,r.s+x.dur*6e4):e0;let xd=r.ev[0].x;r.ev.forEach(v=>{if(v.t<=N)xd=v.x});s+=dv*one(r.s,E,x.pr?xd/(D.d||1):1)}})});return s}
function tgt(p,k){let v=p.tg[k];if(v==null)return p[k];const s=p.sc;if(s)s.ev.forEach(e=>{const w=evW(e,s.el);if(w>0){const to=evTo(p,e)[k];if(to!=null)v+=(to-v)*w}});return v+fxD(p,k)}
function step(){P.forEach(p=>{scStep(p);for(const k in NZ){if(p[k]==null)continue;const T=tgt(p,k),v=p[k]+(T-p[k])*.1+(Math.random()-.5)*NZ[k];p[k]=Math.min(LM[k][1],Math.max(LM[k][0],v))}});
const N=Date.now(),HK=['hr','map','spo2','rr','t','pp','di','evn'];
while(N-HS>=3e5){HS+=3e5;P.forEach(p=>HK.forEach(k=>{if(p.h[k]&&p[k]!=null){p.h[k].shift();p.h[k].push(p[k])}}))}
P.forEach(p=>HK.forEach(k=>{if(p.h[k]&&p[k]!=null)p.h[k][287]=p[k]}))}
function mkSc(sd,auto){if(!sd||!sd.on||!sd.ev||!sd.ev.length)return null;return{run:!!auto,el:0,ev:sd.ev.map(e=>({...e,st:'wait',nx:(+e.at||0)*6e4,left:Math.max(0,parseInt(e.n)||0)}))}}

/* ---- textes ---- */
function evLab(e){const V=VR[e.k];return e.k=='pa'?`PA à ${e.ps}/${e.pd} mmHg`:`${V.l} à ${f(e.v,V.dd)} ${V.u}`}
function evTxt(e){const V=VR[e.k],c=e.k=='pa'?`PA à ${e.ps??'?'}/${e.pd??'?'} mmHg`:`${V.l} à ${e.v===''||e.v==null?'?':e.v} ${V.u}`;
let s=`${c}, ${+e.at||0} min après le démarrage du scénario, ${+e.z>0?`installation progressive sur ${e.z} min`:'installation brutale'}. `;
s+=e.res=='none'?'Persiste jusqu’à la fin de la séance.':`${e.res=='fill'?`Correction dès ${LG(e)} min après le début d’un remplissage vasculaire : 50 % à ${H50(e)} min, quasi complète vers ${f(LG(e)+(H50(e)-LG(e))*5.6,0)} min, tant que le remplissage coule (arrêt du remplissage = arrêt de la correction)`:e.res=='drug'?`Résolution ${LG(e)} min après l’administration de ${e.rd||'?'}, retour à l’état de base en ${+e.r||0} min`:e.res=='auto'?`Résolution spontanée après ${e.rv||'?'} min, retour à l’état de base en ${+e.r||0} min`:`Résolution déclenchée par le formateur, retour à l’état de base en ${+e.r||0} min`}.${+e.n>0?` Récidive ${e.n} fois, ${+e.rt||0} min après chaque résolution.`:''}`;return s}
function fxLab(x){const V=VR[x.k],u=x.k=='pa'?'mmHg de PAM':V.u,dd=x.k=='t'||x.k=='di'?1:0;return `${V.l} ${+x.dv>0?'+':''}${f(+x.dv||0,dd)} ${u}, effet maximal en ${f(+x.lag||0,0)} min${+x.dur>0?`, pendant ${f(x.dur,0)} min`:', tant que le médicament est administré'}${x.pr?', proportionnel à la dose':''}`}
function fxTxt(x){const D=DR.find(d=>d.n==x.dn);return `${x.dn} : ${fxLab(x)}${x.pr&&D?` (référence : ${f(D.d,2)} ${D.u})`:''}.`}
function evSt(p,e){const el=p.sc.el;if(e.st=='wait')return `déclenchement dans ${mmss(e.nx-el)}`;
if(e.st=='on'){const w=+e.z>0?Math.min(1,(el-e.ts)/(e.z*6e4)):1,a=w<1?`installation ${R(w*100)} %`:'installé';const r=e.res=='fill'?`correction ${R((e.cr||0)*100)} % (${R(fillVol(p,e.tR))} mL de remplissage perfusés)`:e.res=='drug'?`attend : ${e.rd}`:e.res=='auto'?`résolution dans ${mmss(e.rv*6e4-(el-e.ts))}`:e.res=='man'?'résolution par le formateur':'persistant';return `${a}, ${r}`}
if(e.st=='res')return `retour à l’état de base (${R((1-evW(e,el))*100)} %)`;return 'terminé'}

/* ---- bandeau formateur ---- */
function fbU(p,force){const b=$('#fb');if(!b)return;const s=p.sc,hx=p.fx&&p.fx.length;b.hidden=!(s||hx);if(b.hidden)return;
const sg=JSON.stringify([s?[s.run,!!s.el,s.ev.map(e=>[e.st,e.left])]:0,hx]);
if(force||b.dataset.sg!==sg){b.dataset.sg=sg;
b.innerHTML=`<div class="fbh"><b>Formateur</b>${s?`<span id="fbt" class="fbt"></span><button class="sm" onclick="scRun()">${s.run?'Mettre en pause':s.el?'Reprendre':'Démarrer le scénario'}</button><button class="sm" onclick="scReset()">Réinitialiser</button>`:''}<button class="sm" onclick="pfOpen(sel,2)">Modifier le scénario</button><span class="mu">Masquez ce bandeau avec « Vue formateur » avant de laisser la place aux apprenants.</span></div>`
+(s?`<ul class="fbl">${s.ev.map((e,j)=>`<li><span class="fbn">${esc(evLab(e))}</span><span id="fbs${j}" class="mu"></span>${+e.n>0?`<small class="mu">${e.left} récidive${e.left>1?'s':''} restante${e.left>1?'s':''}</small>`:''}${e.st=='wait'?`<button class="sm" onclick="scTrig(${j})">Déclencher maintenant</button>`:''}${e.st=='on'?`<button class="sm" onclick="scRes(${j})">Résoudre maintenant</button>`:''}</li>`).join('')}</ul>`:'')
+(hx?`<p class="fbx"><b>Effets programmés</b> : ${p.fx.map(x=>esc(x.dn)+' → '+esc(fxLab(x))).join(' ; ')}</p>`:'')}
if(s){const t=$('#fbt');if(t)t.textContent=`${s.run?'En cours':s.el?'En pause':'Non démarré'}, ${mmss(s.el)} écoulées`;s.ev.forEach((e,j)=>{const x=$('#fbs'+j);if(x)x.textContent=evSt(p,e)})}}
function scRun(){const s=P[sel].sc;s.run=!s.run;log(`Simulation : scénario ${s.run?'démarré':'mis en pause'}`,P[sel].b);fbU(P[sel],1)}
function scReset(){const p=P[sel];p.sc=mkSc(p.scd,false);log('Simulation : scénario réinitialisé',p.b);fbU(p,1)}
function scTrig(j){const p=P[sel],e=p.sc.ev[j];p.sc.run=true;trig(p,e,p.sc.el);fbU(p,1)}
function scRes(j){const p=P[sel],e=p.sc.ev[j];reso(p,e,p.sc.el,'man');fbU(p,1)}
function tgFM(){FM=!FM;document.body.classList.toggle('nofm',!FM);const b=$('#fmb');b.setAttribute('aria-pressed',FM);b.textContent=FM?'Vue formateur : affichée':'Vue formateur : masquée'}

/* ---- conservation (navigateur) ---- */
const SK='simrea.v1';let ST={demo:true,drugs:[],pts:[]};
try{const x=JSON.parse(localStorage.getItem(SK)||'null');if(x)ST={demo:x.demo!==false,drugs:x.drugs||[],pts:x.pts||[],scs:x.scs||[]}}catch(e){}
function save(){ST.pts=P.filter(p=>p.sim).map(p=>p.def);try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}}
function reidx(){P.sort((a,b)=>a.b-b.b);P.forEach((p,i)=>p.i=i)}
function freeBed(b,self){const used=x=>P.some(p=>p.b==x&&p!==self);if(b>=1&&!used(b))return b;let n=1;while(used(n))n++;return n}

/* ---- médicaments personnalisés ---- */
function mkDrug(c){const d=+c.d,mx=+c.mx;let D;
if(c.ty=='i')D={n:c.n,it:1,xf:1,dil:'NaCl 0,9 %',u:'mg',k:0,m:1,c:d/50,cu:'mg/mL',lo:d*.5,hi:d*2,max:mx,dmax:mx*6,s:0,d,nb:1,dur:+c.dur||15,t0:360,pr:'ampoule',q:d,pv:0,pt:`${f(d,2)} mg (produit fictif)`,cx:d/5,rc:[{s:'Dilution simulée',n:1,vf:50,t:`${f(d,2)} mg qsp 50 mL de NaCl 0,9 %`}]};
else if(c.u=='µg/kg/min'){const cc=d*840,q=cc*50;D={n:c.n,u:'µg/kg/min',k:1,m:60,c:cc,cu:'µg/mL',lo:d*.25,hi:d*2,max:mx,s:0,d,pr:'ampoule',q,pv:10,pt:`${f(q/1000,2)} mg / 10 mL (produit fictif)`,cx:q/10,rc:[{s:'Dilution simulée',n:1,vf:50,t:`1 ampoule qsp 50 mL de NaCl 0,9 % (${f(cc,1)} µg/mL)`}]}}
else{const q=d*10;D={n:c.n,u:'mg/h',k:0,m:1,c:q/50,cu:'mg/mL',lo:d*.25,hi:d*2,max:mx,s:0,d,pr:'ampoule',q,pv:10,pt:`${f(q,2)} mg / 10 mL (produit fictif)`,cx:q/10,rc:[{s:'Dilution simulée',n:1,vf:50,t:`1 ampoule qsp 50 mL de NaCl 0,9 % (${f(q/50,2)} mg/mL)`}]}}
D.cust=c;return D}
function addDrug(c,quiet){if(!c||!c.n||DR.some(x=>x.n.toLowerCase()==String(c.n).toLowerCase()))return false;DR.push(mkDrug(c));if(!quiet){ST.drugs.push(c);save()}return true}

/* ---- création d'un patient ---- */
const VTF=v=>v.m=='O2'?(v.flow?'o2':'air'):v.m=='Optiflow'?'hd':v.ni?'vni':v.m.toLowerCase();
const MOD=[{lab:'Patient vierge (constantes normales)',dx:'',a:60,kg:75,sx:'Homme',base:{hr:80,s:125,d:75,spo2:97,rr:16,t:37,di:1,evn:1},vm:'air',v:{},so:'>94 %',rx:[]},
...B.map((b,i)=>{const t={hr:b[5],spo2:b[6],map:b[7],rr:b[8],t:b[9],...b[10]},v=VT[i];return{lab:`${b[3]} (${SX[i]=='Homme'?'homme':'femme'}, ${b[1]} ans)`,dx:b[3],a:b[1],kg:b[2],sx:SX[i],base:{hr:t.hr,s:t.map+30,d:t.map-15,spo2:t.spo2,rr:t.rr,t:t.t,di:{0:.5,2:.3,3:2}[i]||1,evn:3},vm:VTF(v),v,so:i==9?'88–90 %':'>94 %',rx:b[11].map(([d,x])=>[DR[d].n,x])}})];
function newPat(d){const N0=Date.now(),md=new Date(N0).setHours(0,0,0,0),kg=+d.kg,b=d.base,map=(b.s+2*b.d)/3,pp=b.s-b.d,i=P.length;
const p={i,sx:d.sx,b:d.b,ini:d.ini,a:d.a,kg,dx:d.dx,v:'',ack:{},sig:'',rx:[],hx:[],h:{},iv:120,cs:[],nid:1,ov:{},nm:[],nx:[],sim:1,def:d};
p.tg={hr:+b.hr,spo2:+b.spo2,map,pp,rr:+b.rr,t:+b.t,di:b.di*kg,evn:+b.evn};Object.assign(p,p.tg);
['hr','map','spo2','rr','t','pp'].forEach(k=>p.h[k]=Array.from({length:288},(_,n)=>Math.min(LM[k][1],Math.max(LM[k][0],p.tg[k]+Math.sin(n/17+i+k.length)*NZ[k]*.8+(Math.random()-.5)*NZ[k]*1.5))));
p.h.di=Array.from({length:288},(_,n)=>Math.max(0,R(p.tg.di*(1+.15*Math.sin(n/23+i))+(Math.random()-.5)*6)));
p.h.evn=Array.from({length:288},(_,n)=>Math.min(10,Math.max(0,R(p.tg.evn+1.2*Math.sin(n/31+i)+(Math.random()-.5)))));
p.vl=[{t:md-30*36e5,v:{...d.vent}}];
(d.rx||[]).forEach(([dn,x])=>{const j=DR.findIndex(z=>z.n==dn);if(j>=0)p.rx.push(sd(j,x,kg))});
p.scd=d.sc||null;p.sc=mkSc(p.scd,p.scd&&p.scd.auto);p.fx=p.scd&&p.scd.on?(d.fx||[]):[];
P.push(p);return p}

/* ---- unité ---- */
function utb(){const dm=P.some(p=>!p.sim);return `<div class="utb">${P.length?'':'<p class="mu">Aucun patient dans l’unité. Créez un premier patient fictif.</p>'}<button class="pb2" onclick="pfOpen(null)">Créer un patient fictif</button><button class="pb2 alt" onclick="fpick()">Ouvrir un fichier (patient ou scénario)</button><span class="mu fdr">ou glissez-déposez des fichiers .json sur la page</span><span class="fmo">${dm?`<button class="pb2 alt" onclick="rmDemo(this)">Retirer les patients de démonstration</button>`:`<button class="pb2 alt" onclick="addDemo()">Remettre les patients de démonstration</button>`}</span></div>`}

for(let j=P.length-1;j>=0;j--)if(!P[j].sim)P.splice(j,1);reidx();ST.demo=false;save();render();sum()}

const p=P[sel];P.splice(sel,1);reidx();save();sel=null;render();sum()}

/* ---- formulaire patient ---- */
const VMO=[['air','Air ambiant'],['o2','Oxygène (lunettes, masque)'],['hd','Oxygène à haut débit (Optiflow)'],['vni','VNI (BIPAP)'],['vac','Ventilation invasive, VAC'],['vsai','Ventilation invasive, VSAI'],['aprv','Ventilation invasive, APRV']];
const opt=(arr,v)=>arr.map(([k,t])=>`<option value="${esc(k)}"${k==v?' selected':''}>${esc(t)}</option>`).join('');
function pfOpen(i,tab){const p=i==null?null:P[i];

if(!DIR){dd.textContent='';l.innerHTML='<p>Choisissez une fois le dossier « logiciel de simulation en santé » de votre bureau : chaque patient et scénario y sera enregistré automatiquement, et la liste s’affichera ici.</p>';return}
dd.textContent=`Dossier : ${DIR.name}`;if(!await perm(false)){l.innerHTML='<p>Le navigateur demande de confirmer l’accès au dossier. <button class="sm" onclick="reDir()">Autoriser l’accès</button></p>';return}
const fl=[];try{for await(const [n,h] of DIR.entries()){if(h.kind!='file'||!/\.json$/i.test(n))continue;const f=await h.getFile();let type='autre',nom='';if(f.size<5e6){try{const o=JSON.parse(await f.text());if(o&&o.format==FMT){type=o.type;nom=o.nom||''}}catch(e){}}fl.push({name:n,type,nom,date:f.lastModified,h})}}catch(e){l.innerHTML='<p class="lv2">Lecture du dossier impossible.</p>';return}
fl.sort((a,b)=>b.date-a.date);LIB=fl;
fl.filter(x=>x.type=='scenario'&&!ST.scs.some(s=>s.nom==x.nom)).forEach(async x=>{try{const o=JSON.parse(await (await x.h.getFile()).text());impDrugs(o.medicaments);ST.scs.push({nom:clean(o.nom)||x.name,auto:o.scenario.auto,ev:o.scenario.evenements,fx:o.scenario.effets||[]})}catch(e){}});
l.innerHTML=fl.length?`<table class="libt"><thead><tr><th>Type</th><th>Nom</th><th>Modifié le</th><th></th></tr></thead><tbody>${fl.map((x,j)=>`<tr><td><span class="ty ${x.type}">${x.type=='patient'?'Patient':x.type=='scenario'?'Scénario':'Autre'}</span></td><td>${esc(x.nom||x.name)}<small>${esc(x.name)}</small></td><td>${new Date(x.date).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</td><td>${x.type=='patient'?`<button class="sm" onclick="libOpen(${j})">Ajouter à l’unité</button>`:x.type=='scenario'?`<button class="sm" onclick="libOpen(${j})">Ajouter à la bibliothèque</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<p class="mu">Le dossier ne contient encore aucun patient ni scénario.</p>'};
window.libOpen=async j=>{try{fopen([await LIB[j].h.getFile()])}catch(e){note('Ouverture du fichier impossible.')}};
const r0=render;render=function(){r0();if(sel===null)libLoad()};
if(sel===null){$('#app').innerHTML=utb()+grid();gu();libLoad()}
}

/* ============ APPRENANT ============ */
if(MODE=='apprenant'){
const CODE=String(Q.get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
if(CODE.length!=6){location.replace(home);return}
const ID=SS.get('sim.id')||Math.random().toString(36).slice(2,12);SS.set('sim.id',ID);
USER=clean(Q.get('nom'))||'Apprenant';
$('#srvi').innerHTML=`<b>Écran apprenant</b> · séance ${CODE}${LOCK?` · lit ${LOCK}`:''}`;
document.body.classList.add('nofm');if(LOCK)document.body.classList.add('lock');
step=function(){P.forEach(p=>VK.forEach(k=>{if(p.h&&p.h[k]&&p[k]!=null)p.h[k][287]=p[k]}))};
save=function(){};
utb=function(){return P.length?'':`<p class="mu wait">En attente du formateur pour la séance ${CODE}…</p>`};
const b0=back;back=function(){if(!LOCK)b0()};
const pend={},logs={},tm={};
const lg0=log;log=function(m,b){lg0(m,b);if(b==null)return;pend[b]=Date.now()+5000;(logs[b]=logs[b]||[]).push({t:Date.now(),iso:new Date().toISOString(),m});clearTimeout(tm[b]);tm[b]=setTimeout(()=>send(b),150)};
function send(b){const p=P.find(x=>x.b==b);if(!p)return;const keys={};EDK.forEach(k=>keys[k]=p[k]);const lg=logs[b]||[];logs[b]=[];pend[b]=Date.now()+5000;
rq(`seances/${CODE}/x`,'POST',JSON.stringify({b,by:USER,keys,logs:lg})).catch(()=>note('Modification non transmise : connexion internet perdue.'))}
P.length=0;sel=null;render();
const sig=p=>JSON.stringify(EDK.map(k=>p[k]));
function apply(d){(d.drugs||[]).forEach(c=>addDrug(c,1));const prev={};P.forEach(p=>prev[p.b]=p);const selB=sel!=null&&P[sel]?P[sel].b:null,oldBeds=P.map(p=>p.b).join(','),N=Date.now();let chg=false;
const nx=d.pts.map(q=>{const o=prev[q.b];if(o){q.w=o.w;if(pend[q.b]>N||(q.b==selB&&(ed||op||cedit)))EDK.forEach(k=>q[k]=o[k]);else if(q.b==selB&&sig(o)!=sig(q))chg=true}return q});
P.length=0;nx.forEach(p=>P.push(p));P.sort((a,b)=>a.b-b.b);P.forEach((p,i)=>p.i=i);
const tb=LOCK||selB,ix=tb!=null?P.findIndex(p=>p.b==tb):-1;sel=ix>=0?ix:null;
const beds=P.map(p=>p.b).join(',');
if((beds!=oldBeds||(tb!=null&&selB==null&&sel!=null)||(selB!=null&&sel==null))&&!dlg()&&!op&&!ed&&!cedit){render();sum();return}
if(sel!=null&&chg&&!ed&&!op)rxl(P[sel])}
const PC={},HC={},RV={};let HSN=-1,DL=-1,DRUGS=[],busy=false,fails=0,lastT=0,seenT=Date.now();
async function poll(){if(busy)return;busy=true;try{const v=await rq(`seances/${CODE}/v`);
if(!v){const m=await rq(`seances/${CODE}/m`);conn(false,m?'En attente du formateur…':`Séance ${CODE} introuvable : vérifiez le code donné par le formateur.`);busy=false;return}
const bs=Object.keys(v.beds||{}),need=[];
if(v.d!==DL){DRUGS=JSON.parse(await rq(`seances/${CODE}/d`)||'[]');DL=v.d}
for(const b of bs){if(RV[b]!==v.beds[b].r||!PC[b])need.push(rq(`seances/${CODE}/p/${b}`).then(s=>{if(s){PC[b]=s;RV[b]=v.beds[b].r}}));
if(v.hs!==HSN||!HC[b])need.push(rq(`seances/${CODE}/h/${b}`).then(s=>{if(s)HC[b]=JSON.parse(s)}))}
await Promise.all(need);HSN=v.hs;
const pts=bs.filter(b=>PC[b]).map(b=>{const q=JSON.parse(PC[b]),bv=v.beds[b];VK.forEach(k=>{if(bv[k]!=null)q[k]=bv[k]});q.h={};VK.forEach(k=>{q.h[k]=(HC[b]&&HC[b][k]?HC[b][k].slice():Array(288).fill(q[k]??0));if(q[k]!=null)q.h[k][287]=q[k]});q.sc=null;q.fx=[];return q});
apply({drugs:DRUGS,pts});fails=0;if(v.t!==lastT){lastT=v.t;seenT=Date.now()}conn(Date.now()-seenT<15e3,'Le formateur ne transmet plus : son écran est peut-être fermé ou hors connexion.')}
catch(e){if(++fails>2)conn(false,'Connexion internet perdue : nouvelle tentative en cours…')}busy=false}
setInterval(()=>rq(`seances/${CODE}/a/${ID}`,'PUT',Date.now()).catch(()=>{}),5000);
poll();setInterval(poll,1000);
}
})();

</script>
