<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulateur de réanimation</title>
<style>:root{color-scheme:light dark;--bg:#edf2f4;--fg:#14232d;--sf:#fff;--ln:#ccd8de;--ac:#0b5f73;--ac2:#5b3f94}@media(prefers-color-scheme:dark){:root{--bg:#0d1a22;--fg:#e2edf2;--sf:#14262f;--ln:#27424f;--ac:#3a9bb4;--ac2:#8f73cf}}
body{margin:0;font:17px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}main{max-width:640px;margin:auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}h1{margin:0 0 4px}p.mu{opacity:.75;margin:0}
.b{display:block;margin:16px 0;padding:18px 20px;border-radius:8px;background:var(--ac);color:#fff;text-decoration:none;font-weight:600;font-size:20px}.b small{display:block;font-weight:400;font-size:15px;opacity:.9}.ap{background:var(--ac2)}
form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}input{font:inherit;padding:8px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--fg)}#code{font-size:22px;letter-spacing:.2em;text-transform:uppercase;width:8em}#lit{width:5em}button{font:inherit;font-weight:600;padding:8px 16px;border:0;border-radius:6px;background:#fff;color:#5b3f94;cursor:pointer}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}</style></head>
<body><main><h1>Simulateur de réanimation</h1><p class="mu">Patients fictifs pour la formation par simulation en santé. Non destiné à un usage clinique.</p>
<a class="b" href="formateur.html">Je suis formateur<small>Ouvre une séance et donne un code aux apprenants.</small></a>
<div class="b ap">Je suis apprenant<small>Entrez le code donné par le formateur (et, si besoin, votre numéro de lit).</small>
<form action="apprenant.html" method="get"><input id="code" name="code" required minlength="6" maxlength="6" placeholder="CODE" autocomplete="off" aria-label="Code de la séance"><input id="lit" name="lit" type="number" min="1" max="99" placeholder="lit" aria-label="Lit (facultatif)"><button>Rejoindre</button></form></div></main></body></html>
